name: Metrics & Profile Assets

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
      - master

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Generate Classic GitHub Readme Stats & Top Languages Cards
      - name: Generate Readme Stats & Top Languages
        uses: stats-organization/github-readme-stats-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: JordanCJ7
          output_dir: assets
          theme: vision-friendly-dark
          show_icons: true
          count_private: true
          include_all_commits: true

      # Step 2: Contribution Grid Snake Animation
      - name: Generate Snake Animation
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: JordanCJ7
          outputs: |
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 3: Commit and Push all generated assets back to repository
      - name: Commit & Push Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if [ -n "$(git status --porcelain assets/)" ]; then
            git commit -m "auto: update profile metrics and assets [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          else
            echo "No changes in assets to commit."
          fi
