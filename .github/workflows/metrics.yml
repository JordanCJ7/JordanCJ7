name: Metrics & Profile Assets

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
      - master

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Base Metrics & Stats Overview
      - name: General Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: JordanCJ7
          filename: assets/github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo

      # Step 2: Top Languages Breakdown
      - name: Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: JordanCJ7
          filename: assets/metrics.plugin.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          config_timezone: Asia/Colombo

      # Step 3: Achievements & Badges
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: JordanCJ7
          filename: assets/metrics.plugin.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: X
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          config_timezone: Asia/Colombo

      # Step 4: Contribution Grid Snake Animation
      - name: Generate Snake Animation
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: JordanCJ7
          outputs: |
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 5: Commit and Push all generated assets back to repository
      - name: Commit & Push Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if [ -n "$(git status --porcelain assets/)" ]; then
            git commit -m "auto: update profile metrics and assets [skip ci]"
            git push
          else
            echo "No changes in assets to commit."
          fi
